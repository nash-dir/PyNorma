name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cli]"

      - name: Lint with ruff
        run: |
          ruff check pynorma/ --output-format=github
        continue-on-error: true

      - name: Run tests (unit + engine; corpus-dependent tests skip when data is absent)
        run: |
          pytest tests/ specimen/benchmark/tests/ -v --tb=short --cov=pynorma --cov-report=term-missing --cov-report=xml

      - name: Smoke-test the CLI
        run: |
          pynorma --version
          pynorma detect examples/townbusiness1.csv

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
