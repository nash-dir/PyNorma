[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynorma"
version = "1.0.0b1"
description = "A smart tool for preprocessing messy tabular data."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "nash-dir"},
]
keywords = ["data", "preprocessing", "tabular", "excel", "csv", "cleaning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "chardet>=5.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.9",
    "click>=8.0",
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
pynorma = "pynorma.cli:main"

[project.urls]
Homepage = "https://github.com/nash-dir/PyNorma"
Repository = "https://github.com/nash-dir/PyNorma"

[tool.setuptools.packages.find]
include = ["pynorma*"]

[tool.setuptools.package-data]
pynorma = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
